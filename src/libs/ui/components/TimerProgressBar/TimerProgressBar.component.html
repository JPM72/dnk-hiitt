<div class="input-group">
	<mat-form-field>
		<input
			matInput
			type="number"
			inputmode="numeric"
			placeholder="0"
			min="0"
			[formControl]="rounds"
		/>
		<span matTextSuffix>rounds</span>
	</mat-form-field>
</div>
<div class="timer-container">
	<div class="progress-spinner-container">
		<mat-progress-spinner
			mode="determinate"
			value="100"
			class="background-spinner"
		/>
		<mat-progress-spinner mode="determinate" [value]="store.progress()" />
		<app-segmented-circular-progress
			[steps]="store.rounds()"
			[step]="store.currentRound()"
			[style.display]="store.rounds() ? '' : 'none'"
		/>
		<div class="timer-display">
			@if (store.isPaused()) {
			<app-duration-input
				[(seconds)]="currentSeconds"
				(secondsChange)="onSecondsChanged($event)"
				[onEnterCallback]="onEnterCallback"
			/>
			} @else {
			<app-timer-text-display
				[milliseconds]="store.currentTime()"
				[showMilliseconds]="false"
			/>
			}
			<div class="timer-text rounds-text">{{ roundsText() }}</div>
		</div>
	</div>
</div>
<div class="button-group">
	<button mat-fab aria-label="Start" (click)="play()">
		<mat-icon> @if (store.isPaused()) {play_arrow} @else {pause} </mat-icon>
	</button>
	<button mat-fab aria-label="Stop" (click)="reset()">
		<mat-icon>stop</mat-icon>
	</button>
</div>
<div class="volume-slider-container">
	<mat-icon fontIcon="volume_up" />
	<mat-slider class="volume-slider" min="0" max="1" step="0.01" value="0.5">
		<input matSliderThumb [formControl]="audioVolume" #slider />
	</mat-slider>
</div>
