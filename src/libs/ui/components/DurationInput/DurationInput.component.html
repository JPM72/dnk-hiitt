<mat-form-field subscriptSizing="dynamic">
	@let labelValue = label();
	@if (labelValue) {
		<mat-label>{{ labelValue }}</mat-label>
	}
	<input
		matInput
		type="text"
		inputmode="numeric"
		autocomplete="off"
		#controlElement
		[formControl]="control"
		(beforeinput)="onBeforeInput($event)"
		(blur)="onBlur($event)"
	/>
</mat-form-field>
